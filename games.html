<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@500;600;700;800&display=swap');
:root{
  --page:#f3f5f1; --surface:#ffffff; --ink:#142a22; --ink-soft:#56645e;
  --line:#d9ded9; --accent:#bb7d1c; --green:#1c5b45; --green-faint:#e6f0eb;
  --shadow:0 20px 50px rgba(28,45,36,.09);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:"Noto Sans Ethiopic","Noto Sans",system-ui,sans-serif;
  background:var(--page); color:var(--ink); padding:0 0 60px;
}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--surface);
  border-bottom:1px solid var(--line); padding:14px 18px;
  display:flex; align-items:center; gap:12px;
}
.topbar a.back{
  text-decoration:none; color:var(--green); font-weight:700; font-size:15px;
  border:1px solid var(--line); border-radius:99px; padding:8px 14px; background:var(--surface);
}
.topbar h1{font-size:20px; margin:0; flex:1; text-align:center}
.topbar h1 .en{display:block; font-size:13px; color:var(--ink-soft); font-weight:600}
.wrap{max-width:1060px; margin:0 auto; padding:22px 16px}
.lead{text-align:center; color:var(--ink-soft); margin:4px 0 20px; font-size:15px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:18px;
  overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.card img{width:100%; aspect-ratio:16/10; object-fit:cover; display:block}
.card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
.card .am{font-size:19px; font-weight:800}
.card .en{font-size:14px; color:var(--ink-soft); font-weight:600}
.card .desc{font-size:14px; color:var(--ink-soft); margin:2px 0 8px}
.card .row{display:flex; align-items:center; justify-content:space-between; margin-top:auto}
.badge{font-size:12px; font-weight:700; background:var(--green-faint); color:var(--green);
  border-radius:99px; padding:4px 10px}
.play{
  border:0; border-radius:12px; cursor:pointer; font-family:inherit;
  font-weight:800; font-size:15px; padding:10px 22px; color:#fff;
  background:var(--green);
}
.play:active{transform:translateY(1px)}
/* nested game overlay */
#overlay{
  position:fixed; inset:0; z-index:50; background:var(--page);
  display:flex; flex-direction:column;
}
#overlay.hidden{display:none}
#overlay .gbar{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
#overlay .gbar strong{flex:1; font-size:16px; text-align:center}
#overlay .gbar button{
  border:1px solid var(--line); background:var(--surface); border-radius:99px;
  font-family:inherit; font-weight:800; font-size:14px; padding:8px 14px; cursor:pointer; color:var(--ink);
}
#gameframe{flex:1; width:100%; border:0}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">← መዝሙሮች</a>
    <h1>🎮 የመዝሙር ጨዋታዎች<span class="en">Song Games</span></h1>
    <span style="width:90px"></span>
  </div>
  <div class="wrap">
    <p class="lead">በመዝሙር ይጫወቱ · Play with the songs you love — right here, no downloads.</p>
    <div class="grid" id="grid"></div>
  </div>

  <div id="overlay" class="hidden">
    <div class="gbar">
      <button id="btn-close" type="button">✕ Close</button>
      <strong id="gtitle"></strong>
      <span style="width:80px"></span>
    </div>
    <iframe id="gameframe" title="game" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
  </div>

<script>
"use strict";
// NOTE: keep HG_VERSION in sync with habeshagames.com SITE_VERSION (bump on game updates)
var HG_VERSION = '20261010c';
var GAMES = [
  { dir:'listen-party',           title:'Listen & Guess the Song',      am:'አድምጠው ገምት',            desc:'Hear the song clip, pick the answer!',              mode:'👥 Group' },
  { dir:'guess-party',            title:'Read & Guess the Song',        am:'የቡድን ጨዋታ',              desc:'One host, everyone plays on their phone!',         mode:'👥 Group' },
  { dir:'guess-the-game',         title:'Guess the Song',               am:'መዝሙር',                  desc:'Hear a clip, name the song.',                      mode:'👤 Solo' },
  { dir:'guess-from-lyrics',      title:'Guess from the Lyrics',        am:'ከግጥሙ ገምት',              desc:'Read the lines, guess the song.',                   mode:'👤 Solo' },
  { dir:'worship-song-bingo',     title:'Worship Song Bingo',           am:'የመዝሙር ብንጎ',             desc:'Mark each song, shout bingo!',                      mode:'👥 Group' },
  { dir:'song-roulette',          title:'የመዝሙር እጣ (Song Roulette)',    am:'የመዝሙር እጣ',              desc:'Spin the wheel for your next worship song.',        mode:'👥 Group' },
  { dir:'finish-the-lyrics',      title:'Finish the Lyrics',            am:'የመዝሙሩን ቀጣይ መስመር',     desc:'Pick the next line, collect points.',               mode:'👤 Solo' },
  { dir:'finish-lyrics-party',    title:'Finish the Lyrics Party',      am:'የቡድን ጨዋታ',              desc:'Host starts a room, everyone joins by code!',       mode:'👥 Group' },
  { dir:'finish-the-lyrics-listen', title:'Listen & Finish the Lyrics', am:'ስማ ጨርስ',                desc:'Hear 10 seconds, then finish the lyric!',           mode:'👤 Solo' }
];
var grid = document.getElementById('grid');
GAMES.forEach(function(g){
  var el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<img src="assets/cards/' + g.dir + '.jpg" alt="" loading="lazy">' +
    '<div class="body">' +
      '<div class="am" lang="am">' + g.am + '</div>' +
      '<div class="en">' + g.title + '</div>' +
      '<div class="desc">' + g.desc + '</div>' +
      '<div class="row"><span class="badge">' + g.mode + '</span>' +
      '<button class="play" type="button">▶ Play</button></div>' +
    '</div>';
  el.querySelector('.play').addEventListener('click', function(){ openGame(g); });
  grid.appendChild(el);
});
var overlay = document.getElementById('overlay'),
    frame = document.getElementById('gameframe'),
    gtitle = document.getElementById('gtitle');
function openGame(g){
  gtitle.textContent = g.am + ' · ' + g.title;
  frame.src = 'https://habeshagames.com/games/' + g.dir + '/?v=' + HG_VERSION;
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  window.scrollTo(0,0);
}
function closeGame(){
  frame.src = 'about:blank';
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}
document.getElementById('btn-close').addEventListener('click', closeGame);
</script>
</body>
</html>
