        const sourceParts = [];

        const possibleLabel = video.possible_version ? ' (possible version)' : '';

        return {
          label: `${titleAm}${possibleLabel}`,

    function naturalQueryText(value) {
      return String(value || '')
        .normalize('NFKC')
        .toLocaleLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function naturalThemesForQuery(query) {
      const normalized = naturalQueryText(query);
      if (!normalized) return new Set();
      const paddedQuery = ` ${normalized} `;
      const matches = new Set();
      Object.entries(THEME_SEARCH_SYNONYMS).forEach(([theme, synonyms]) => {
        const aliases = [theme, ...synonyms];
        if (aliases.some(alias => {
          const normalizedAlias = naturalQueryText(alias);
          return normalizedAlias && paddedQuery.includes(` ${normalizedAlias} `);
        })) matches.add(theme);
      });
      return matches;
    }

    function songSearchText(song) {
      return normalizedText([song.titleAm, song.titleEn].join(' '));
    }

    function artistSearchText(song) {
      return normalizedText([song.artistAm, song.artistEn].join(' '));
    }

    function lyricsSearchText(song) {
      return normalizedText(song.lyrics);
    }

    function lyricsMatchSnippet(song, query) {
      const normalized = normalizedText(query);
      if (!normalized || !song.lyrics.trim()) return '';
      const lines = song.lyrics.split('\n').map(line => line.trim()).filter(Boolean);
      const normalizedLines = lines.map(normalizedText);
      const joined = normalizedLines.join(' ');
      const matchIndex = joined.indexOf(normalized);
      if (matchIndex < 0) return '';
      let cursor = 0;
      let lineIndex = 0;
      for (; lineIndex < normalizedLines.length; lineIndex += 1) {
        const lineEnd = cursor + normalizedLines[lineIndex].length;
        if (matchIndex <= lineEnd) break;
        cursor = lineEnd + 1;
      }
      return lyricsForOutput(lines.slice(lineIndex, lineIndex + 2).join(' · '));
    }

    function artistGroups() {
      const groups = new Map();
      songs.forEach(song => {
        const key = normalizedText(song.artistEn || song.artistAm);
        if (!groups.has(key)) groups.set(key, { artistAm: song.artistAm, artistEn: song.artistEn, songs: [] });
        groups.get(key).songs.push(song);
      });
      return Array.from(groups.values()).sort((a, b) => (a.artistEn || a.artistAm).localeCompare(b.artistEn || b.artistAm));
    }

    function renderArtistDirectory(groups) {
      resultCount.textContent = catalogSongCountText;
      emptyEl.classList.remove('visible');
      pagination.hidden = true;
      listEl.className = 'artist-directory';
      listEl.innerHTML = groups.map(group => `
        <button class="artist-choice" type="button" data-artist="${esc(group.artistEn || group.artistAm)}">
          <strong>${esc(group.artistAm)}</strong>
          <span>${esc(group.artistEn)}</span>
          <small>${group.songs.length} መዝሙሮች</small>
        </button>`).join('');
      listEl.querySelectorAll('.artist-choice').forEach(button => {
        button.addEventListener('click', () => {
          searchEl.value = button.dataset.artist;
          currentPage = 1;
          renderList(searchEl.value);
          searchEl.focus({ preventScroll: true });
        });
      });
    }

    const displayedTitleCollator = new Intl.Collator('en', {
      sensitivity: 'base',
      numeric: false,
      ignorePunctuation: false
    });

    function displayedTitleSortKey(song) {
      return normalizedText(song.titleAm || song.titleEn).replace(/q/g, 'g');
    }

    function sortSongsForDisplay(items) {
      if (sortMode === 'title') {
        return items.slice().sort((a, b) => {
          const titleOrder = displayedTitleCollator.compare(displayedTitleSortKey(a), displayedTitleSortKey(b));
          if (titleOrder) return titleOrder;
          const displayedTitleOrder = displayedTitleCollator.compare(
            normalizedText(a.titleAm || a.titleEn),
            normalizedText(b.titleAm || b.titleEn)
          );
          return displayedTitleOrder || a.sourceIndex - b.sourceIndex;
        });
      }
      return items.slice().sort((a, b) => {
        const artistOrder = normalizedText(a.artistAm).localeCompare(normalizedText(b.artistAm));
        if (artistOrder) return artistOrder;
        const albumOrder = normalizedText(a.primaryAlbum).localeCompare(normalizedText(b.primaryAlbum));
        if (albumOrder) return albumOrder;
        const aTrack = Number.isFinite(a.albumTrack) ? a.albumTrack : Number.MAX_SAFE_INTEGER;
        const bTrack = Number.isFinite(b.albumTrack) ? b.albumTrack : Number.MAX_SAFE_INTEGER;
        if (aTrack !== bTrack) return aTrack - bTrack;
        return a.sourceIndex - b.sourceIndex;
      });
    }

    function staticExportUrl(song, kind) {
      if (kind === 'pptx') return `https://worshipmezmur.com/assets/pptx/${song.id}.pptx`;
      const baseName = safeFileName(song.titleEn || song.titleAm);
      return `assets/docx/${baseName}-Lyrics-Word.docx`;
    }

    function renderArtistStats() {
      const selectedArtist = normalizedText(artistFilter.value);
      if (!selectedArtist) {
        artistStats.hidden = true;
        artistStats.innerHTML = '';
        return;
      }
      const artistSongs = songs.filter(song => artistSearchText(song) === selectedArtist);
      const albums = new Set(artistSongs.flatMap(song => song.albums).map(normalizedText).filter(Boolean));
      const withLyrics = artistSongs.filter(song => song.lyrics.trim()).length;
      const withVideo = artistSongs.filter(song => song.videos.length).length;
      const lyricsPercent = artistSongs.length ? Math.round((withLyrics / artistSongs.length) * 100) : 0;
      const videoPercent = artistSongs.length ? Math.round((withVideo / artistSongs.length) * 100) : 0;
      artistStats.innerHTML = `
        <div class="artist-stat"><strong>${artistSongs.length.toLocaleString()}</strong><span>መዝሙሮች</span></div>
        <div class="artist-stat"><strong>${albums.size.toLocaleString()}</strong><span>አልበሞች</span></div>
        <div class="artist-stat"><strong>${lyricsPercent}%</strong><span>ግጥም ያላቸው</span></div>
        <div class="artist-stat"><strong>${videoPercent}%</strong><span>ቪዲዮ ያላቸው</span></div>`;
      artistStats.hidden = false;
    }

    async function loadVerifiedPowerPoint(song) {
      const response = await fetch(staticExportUrl(song, 'pptx'));
      if (!response.ok) throw new Error('PowerPoint file unavailable');
      const blob = await response.blob();
      const signature = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
      if (signature.length < 4 || signature[0] !== 0x50 || signature[1] !== 0x4b || signature[2] !== 0x03 || signature[3] !== 0x04) {
        throw new Error('Invalid PowerPoint file');
      }
      return new Blob([blob], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
    }

    function paginationItems(totalPages, activePage) {
      if (totalPages <= 7) return Array.from({ length: totalPages }, (_, index) => index + 1);
      if (activePage <= 4) return [1, 2, 3, 4, 5, 'ellipsis', totalPages];
      if (activePage >= totalPages - 3) return [1, 'ellipsis', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
      return [1, 'ellipsis', activePage - 1, activePage, activePage + 1, 'ellipsis', totalPages];
    }

    function renderPagination(totalItems) {
      const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      pagination.hidden = totalItems === 0;
      pageSizeSelect.value = String(pageSize);
      if (totalItems === 0) {
        pageNav.innerHTML = '';
        return;
      }
      const items = paginationItems(totalPages, currentPage);
      pageNav.innerHTML = `
        <button class="page-button" type="button" data-page="${currentPage - 1}" aria-label="Previous page"${currentPage === 1 ? ' disabled' : ''}>‹</button>
        ${items.map(item => item === 'ellipsis'
          ? '<span class="page-ellipsis" aria-hidden="true">…</span>'
          : `<button class="page-button" type="button" data-page="${item}" aria-label="Page ${item}"${item === currentPage ? ' aria-current="page"' : ''}>${item}</button>`).join('')}
        <button class="page-button" type="button" data-page="${currentPage + 1}" aria-label="Next page"${currentPage === totalPages ? ' disabled' : ''}>›</button>`;
      pageNav.querySelectorAll('.page-button[data-page]').forEach(button => {
        button.addEventListener('click', () => {
          const requestedPage = Number(button.dataset.page);
          if (!Number.isFinite(requestedPage) || requestedPage < 1 || requestedPage > totalPages || requestedPage === currentPage) return;
          currentPage = requestedPage;
          renderList(searchEl.value);
          document.querySelector('.search-tools').scrollIntoView({ behavior: 'smooth', block: 'start' });
          requestAnimationFrame(() => {
            const activeButton = pageNav.querySelector('[aria-current="page"]');
            if (activeButton) activeButton.focus({ preventScroll: true });
          });
        });
      });
    }

    function renderList(query = '') {
      const normalized = normalizedText(query);
      const naturalThemes = naturalThemesForQuery(query);
      const selectedArtist = normalizedText(artistFilter.value);
      const selectedTheme = normalizedText(themeFilter.value);
      const sourceSongs = sharedSongId && !normalized && !selectedArtist && !selectedTheme
        ? songs.filter(song => song.id === sharedSongId)
        : songs;
      const filtered = sortSongsForDisplay(sourceSongs.filter(song => {
        const matchesArtist = !selectedArtist || artistSearchText(song) === selectedArtist;
        const matchesTheme = !selectedTheme || song.themes.some(theme => normalizedText(theme) === selectedTheme);
        const matchesNaturalTheme = naturalThemes.size > 0 && song.themes.some(theme => naturalThemes.has(theme));
        const matchesSearch = !normalized
          || songSearchText(song).includes(normalized)
          || artistSearchText(song).includes(normalized)
          || lyricsSearchText(song).includes(normalized)
          || matchesNaturalTheme;
        const hasCompleteContent = !completeOnly.checked || (song.videos.length > 0 && Boolean(song.lyrics.trim()));
        return matchesArtist && matchesTheme && matchesSearch && hasCompleteContent;
      }));
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      const pageStart = (currentPage - 1) * pageSize;
      const visibleSongs = filtered.slice(pageStart, pageStart + pageSize);
      const matchingArtists = new Set(filtered.map(song => normalizedText(song.artistAm)).filter(Boolean)).size;
      const themeLabel = themeFilter.value ? ` · ${themeFilter.value}` : '';

    function youtubeVideoId(href) {
      try {
        const url = new URL(href);
        const hostname = url.hostname.toLowerCase().replace(/^www\./, '');
        let candidate = '';
        if (hostname === 'youtu.be') {
          candidate = url.pathname.split('/').filter(Boolean)[0] || '';
        } else if (hostname === 'youtube.com' || hostname.endsWith('.youtube.com')) {
          candidate = url.searchParams.get('v') || '';
          if (!candidate) {
            const pathMatch = url.pathname.match(/^\/(?:shorts|embed|live)\/([^/?#]+)/);
            candidate = pathMatch ? pathMatch[1] : '';
          }
        }
        return /^[A-Za-z0-9_-]{11}$/.test(candidate) ? candidate : '';
      } catch (error) {
        return '';
      }
    }

    function youtubeEmbedUrl(href, autoplay = false) {
      const videoId = youtubeVideoId(href);
      if (!videoId) return '';
      const params = new URLSearchParams({
        autoplay: autoplay ? '1' : '0',
        playsinline: '1',
        rel: '0'
      });
      return `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?${params.toString()}`;
    }

    function legacyCopyText(text) {
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.top = '0';
      field.style.left = '0';
      field.style.width = '1px';
      field.style.height = '1px';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.focus({ preventScroll: true });
      field.select();
      field.setSelectionRange(0, field.value.length);
      const copied = document.execCommand('copy');
      field.remove();
      if (!copied) throw new Error('Copy unavailable');
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch (error) {
          // Sandboxed desktop browsers can expose Clipboard API but block it.
          // Fall through to the user-gesture copy path instead.
        }
      }
      legacyCopyText(text);
    }

    function wrapCanvasLine(context, text, maxWidth) {
      if (!text) return [''];
      const words = text.split(/\s+/).filter(Boolean);
      if (!words.length) return [''];
      const lines = [];
      let current = words[0];
      for (let index = 1; index < words.length; index += 1) {
        const candidate = `${current} ${words[index]}`;
        if (context.measureText(candidate).width <= maxWidth) {
          current = candidate;
        } else {
          lines.push(current);
          current = words[index];
        }
      }
      lines.push(current);
      return lines;
    }

    function roundedCanvasRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    async function createSongImageFile(song) {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Canvas unavailable');
      const width = 1200;
      const outer = 44;
      const inner = 76;
      const contentWidth = width - (outer + inner) * 2;
      const family = '"Noto Sans Ethiopic", "Noto Sans", sans-serif';
      const album = song.album && song.album !== '—' && song.album !== 'አልበም ያልተገለጸ' ? song.album : '';
      let lyricSize = 44;
      let lyricLines = [];
      let lineHeight = 68;
      let height = 0;
      while (lyricSize >= 22) {
        context.font = `500 ${lyricSize}px ${family}`;
        lyricLines = lyricsForOutput(song.lyrics).trim().split('\n').flatMap(line => wrapCanvasLine(context, line, contentWidth));
        lineHeight = Math.round(lyricSize * 1.55);
        height = 360 + lyricLines.length * lineHeight + 120;
        if (height <= 11800) break;
        lyricSize -= 2;
      }
      canvas.width = width;
      canvas.height = Math.max(720, height);
      context.fillStyle = '#eef2ee';
      context.fillRect(0, 0, canvas.width, canvas.height);
      roundedCanvasRect(context, outer, outer, width - outer * 2, canvas.height - outer * 2, 28);
      context.fillStyle = '#ffffff';
      context.fill();
      context.save();
      roundedCanvasRect(context, outer, outer, width - outer * 2, canvas.height - outer * 2, 28);
      context.clip();
      context.fillStyle = '#1c5b45';
      context.fillRect(outer, outer, width - outer * 2, 18);
      context.restore();

      const left = outer + inner;
      let y = 142;
      context.fillStyle = '#bb7d1c';
      context.font = `700 25px ${family}`;
      context.fillText('የመዝሙር ግጥም', left, y);
      y += 72;
      context.fillStyle = '#142a22';
      context.font = `700 62px ${family}`;
      const titleLines = wrapCanvasLine(context, song.titleAm, contentWidth);
      titleLines.forEach(line => {
        context.fillText(line, left, y);
        y += 78;
      });
      context.fillStyle = '#1c5b45';
      context.font = `500 30px ${family}`;
      const metaLine = `${song.artistAm}${album ? `  ·  ${album}` : ''}`;
      wrapCanvasLine(context, metaLine, contentWidth).forEach(line => {
        context.fillText(line, left, y);
        y += 42;
      });
      y += 20;
      context.strokeStyle = '#d9ded9';
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(left, y);
      context.lineTo(width - outer - inner, y);
      context.stroke();
      y += 64;
      context.fillStyle = '#142a22';
      context.font = `500 ${lyricSize}px ${family}`;
      lyricLines.forEach(line => {
        if (line) context.fillText(line, left, y);
        y += lineHeight;
      });

      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('Image unavailable');
      return new File([blob], `${safeFileName(song.titleEn || song.titleAm)}-Lyrics.png`, { type: 'image/png' });
    }

    function xmlEscape(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[character]));
    }

    function lyricPages(song) {
      if (!song.lyrics.trim()) {
        return [[song.titleAm, song.artistAm, 'ግጥሙ ገና አልተጨመረም']];
      }
      return lyricsForOutput(song.lyrics).trim().split(/\n\s*\n/).flatMap(stanza => {
        const lines = stanza.split('\n').map(line => line.trim()).filter(Boolean);
        const pages = [];
        for (let index = 0; index < lines.length; index += 7) pages.push(lines.slice(index, index + 7));
        return pages;
      });
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let index = 0; index < 256; index += 1) {
        let value = index;
        for (let bit = 0; bit < 8; bit += 1) value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
        table[index] = value >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (const byte of bytes) crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    function concatBytes(parts) {
      const output = new Uint8Array(parts.reduce((total, part) => total + part.length, 0));
      let offset = 0;
      parts.forEach(part => { output.set(part, offset); offset += part.length; });
      return output;
    }

    function makeZip(entries, mimeType) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      entries.forEach(entry => {
        const name = encoder.encode(entry.name);
        const data = entry.data instanceof Uint8Array ? entry.data : encoder.encode(entry.data);
        const crc = crc32(data);
        const local = new Uint8Array(30 + name.length);
        const localView = new DataView(local.buffer);
        localView.setUint32(0, 0x04034b50, true);
        localView.setUint16(4, 20, true);
        localView.setUint16(6, 0x0800, true);
        localView.setUint16(8, 0, true);
        localView.setUint16(10, 0, true);
        localView.setUint16(12, 0, true);
        localView.setUint32(14, crc, true);
        localView.setUint32(18, data.length, true);
        localView.setUint32(22, data.length, true);
        localView.setUint16(26, name.length, true);
        localView.setUint16(28, 0, true);
        local.set(name, 30);
        localParts.push(local, data);

        const central = new Uint8Array(46 + name.length);
        const centralView = new DataView(central.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint16(8, 0x0800, true);
        centralView.setUint16(10, 0, true);
        centralView.setUint16(12, 0, true);
        centralView.setUint16(14, 0, true);

      });
    }

    function downloadReadyFile(file) {
      if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
      currentFileUrl = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = currentFileUrl;
      link.download = file.name;
      link.hidden = true;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function showFileReadyDialog(song, file, isPowerPoint) {
      const dialog = document.getElementById('fileReadyDialog');
      const saveButton = document.getElementById('fileReadySave');
      currentReadyFile = file;
      currentReadySong = song;
      document.getElementById('fileReadyType').textContent = isPowerPoint ? 'PowerPoint ready' : 'Word document ready';
      document.getElementById('fileReadyTitle').textContent = song.titleEn ? `${song.titleAm} (${song.titleEn})` : song.titleAm;
      document.getElementById('fileReadyArtist').textContent = song.artistAm;
      document.getElementById('fileReadyStatus').textContent = canShareFile(file)
        ? 'Choose Save to Files in your device menu.'
        : 'Your file is ready to save.';
      saveButton.textContent = 'Save to Files';
      if (!dialog.open) dialog.showModal();
      saveButton.focus();
    }

    function setExportButtonMessage(button, message) {
      if (!button) return;
      const originalLabel = button.dataset.originalLabel || button.getAttribute('aria-label') || button.title || '';
      const originalTitle = button.dataset.originalTitle || button.title || '';
      button.dataset.originalLabel = originalLabel;
      button.dataset.originalTitle = originalTitle;
      button.setAttribute('aria-label', message);
      button.title = message;
      window.setTimeout(() => {
        if (!button.isConnected) return;
        button.setAttribute('aria-label', originalLabel);
        button.title = originalTitle;
      }, 2600);
    }

    async function exportSongFile(songId, kind, button) {
      const song = songs.find(item => item.id === songId);
      if (!song) return;
      const isPowerPoint = kind === 'pptx';
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      setExportButtonMessage(button, 'እየተዘጋጀ ነው…');
      showFeedback('ፋይሉ እየተዘጋጀ ነው…');
      try {
        const blob = isPowerPoint ? await loadVerifiedPowerPoint(song) : makeWordDocument(song);
        const baseName = safeFileName(song.titleEn || song.titleAm);
        const fileName = `${baseName}-Lyrics-${isPowerPoint ? 'PowerPoint.pptx' : 'Word.docx'}`;
        const file = new File([blob], fileName, { type: blob.type });
        if (canShareFile(file)) {
          try {
            await shareReadyFile(file, song);
            setExportButtonMessage(button, 'ተጋርቷል');
            showFeedback('ፋይሉ ተጋርቷል');
            return;
          } catch (shareError) {
            if (shareError && shareError.name === 'AbortError') return;
          }
        }
        showFileReadyDialog(song, file, isPowerPoint);
        setExportButtonMessage(button, 'ተዘጋጅቷል');
        showFeedback('ፋይሉ ተዘጋጅቷል');
      } catch (error) {
        setExportButtonMessage(button, 'አልተቻለም');
        showFeedback('ፋይሉን ማዘጋጀት አልተቻለም');
      } finally {
        button.disabled = false;
        button.removeAttribute('aria-busy');
      }
    }

    const artistNames = Array.from(new Set(songs.map(song => song.artistAm).filter(Boolean)))
      .sort((a, b) => a.localeCompare(b));
    artistFilter.insertAdjacentHTML('beforeend', artistNames.map(artist => `<option value="${esc(artist)}">${esc(artist)}</option>`).join(''));
    const themeNames = Array.from(new Set(songs.flatMap(song => song.themes)))
      .sort((a, b) => a.localeCompare(b));
    themeFilter.insertAdjacentHTML('beforeend', themeNames.map(theme => `<option value="${esc(theme)}">Songs about ${esc(theme)}</option>`).join(''));

    searchEl.addEventListener('input', event => {
      sharedSongId = null;
      currentPage = 1;
      renderList(event.target.value);
    });
    artistFilter.addEventListener('change', () => {
      sharedSongId = null;
      currentPage = 1;
      renderList(searchEl.value);
    });
    themeFilter.addEventListener('change', () => {
      sharedSongId = null;
      currentPage = 1;
      renderList(searchEl.value);
    });
    completeOnly.addEventListener('change', () => {
      sharedSongId = null;
      currentPage = 1;
      renderList(searchEl.value);
    });
    pageSizeSelect.addEventListener('change', () => {
      const nextPageSize = Number(pageSizeSelect.value);
      pageSize = [20, 50, 100].includes(nextPageSize) ? nextPageSize : 50;
      currentPage = 1;
      renderList(searchEl.value);
    });
    document.getElementById('closePanel').addEventListener('click', closePanel);
    document.getElementById('lyricsView').addEventListener('click', () => document.getElementById('lyricsScroll').scrollIntoView({ behavior: 'smooth', block: 'start' }));
    document.getElementById('copyLyrics').addEventListener('click', copySelectedLyrics);
    document.getElementById('shareLyrics').addEventListener('click', () => shareSongLink(selectedId));
    document.getElementById('wordLink').addEventListener('click', event => exportSongFile(selectedId, 'docx', event.currentTarget));
    document.getElementById('powerpointLink').addEventListener('click', event => exportSongFile(selectedId, 'pptx', event.currentTarget));
    const fileReadyDialog = document.getElementById('fileReadyDialog');
    document.getElementById('fileReadyClose').addEventListener('click', () => fileReadyDialog.close());
    document.getElementById('fileReadySave').addEventListener('click', async event => {
      if (!currentReadyFile || !currentReadySong) return;
      const saveButton = event.currentTarget;
      saveButton.disabled = true;
      try {
        if (canShareFile(currentReadyFile)) {
          await shareReadyFile(currentReadyFile, currentReadySong);
          document.getElementById('fileReadyStatus').textContent = 'The file was sent to your device menu.';
        } else {
          downloadReadyFile(currentReadyFile);
          document.getElementById('fileReadyStatus').textContent = 'Your download has started.';
        }
      } catch (error) {
        if (!error || error.name !== 'AbortError') {
          downloadReadyFile(currentReadyFile);
          document.getElementById('fileReadyStatus').textContent = 'Your download has started.';
        }
      } finally {
        saveButton.disabled = false;
      }
    });
    fileReadyDialog.addEventListener('click', event => {
      if (event.target === fileReadyDialog) fileReadyDialog.close();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !fileReadyDialog.open) closePanel();
    });
    window.matchMedia('(min-width: 1081px)').addEventListener('change', event => { if (event.matches) closePanel(); });
    window.addEventListener('hashchange', openSongFromHash);
    window.addEventListener('beforeunload', () => {
      if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
    }, { once: true });

    if (!openSongFromHash()) {
      const firstDisplayedSong = sortSongsForDisplay(songs)[0];
      selectedId = firstDisplayedSong ? firstDisplayedSong.id : songs[0].id;
      renderList();
      selectSong(selectedId);
    }
  </script>
<a id="games-fab" href="games.html" aria-label="Song games">🎮 <span>ጨዋታዎች</span></a>
</body>
</html>
